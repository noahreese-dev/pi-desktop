<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; img-src * data: file:; frame-src file:; media-src * blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' file:" />
  <title>Pi Desktop</title>
  <link rel="stylesheet" href="../node_modules/@highlightjs/cdn-assets/styles/github-dark-dimmed.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="drag traffic"></div>
    <button id="newChat" class="side-btn" data-fast title="New chat (⌘N)">
      <svg viewBox="0 0 20 20"><path d="M4 16h3l8.5-8.5a2.1 2.1 0 0 0-3-3L4 13v3z" /></svg>
      <span>New chat</span><kbd>⌘N</kbd>
    </button>
    <div class="side-search"><input id="threadSearch" placeholder="Search chats" spellcheck="false" /></div>
    <nav id="threads"></nav>
    <div id="sideFoot"></div>
  </aside>

  <main id="main" class="is-empty">
    <header id="topbar" class="drag">
      <button id="sideToggle" class="icon-btn" data-fast title="Toggle sidebar (⌘B)"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2.5" /><path d="M7.5 4v12" /></svg></button>
      <div id="crumb"></div>
      <div class="top-actions">
        <button id="panelToggle" class="icon-btn" data-fast title="Side panel (⌘\)">
          <svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2.5" /><path d="M12.5 4v12" /></svg>
        </button>
      </div>
    </header>

    <div id="scroller">
      <div id="hero"></div>
      <div id="thread"></div>
    </div>

    <button id="toBottom" hidden title="Scroll to bottom"><svg viewBox="0 0 20 20"><path d="M10 4v12M5.5 11.5 10 16l4.5-4.5" /></svg></button>
    <div id="dock">
      <div id="crash" hidden></div>
      <div id="working" hidden></div>
      <div id="widgets" hidden></div>
      <div id="queue" hidden></div>
      <div id="composer">
        <div id="slashMenu" class="menu" hidden></div>
        <div id="attachments" hidden></div>
        <textarea id="input" rows="1" spellcheck="true" placeholder="Ask anything…"></textarea>
        <div class="composer-bar">
          <div class="left">
            <button id="attachBtn" class="icon-btn round" title="Attach files or images"><svg viewBox="0 0 20 20"><path d="M15.5 9.5l-5.6 5.6a3.5 3.5 0 0 1-5-5l6-6a2.3 2.3 0 0 1 3.3 3.3l-6 6a1.2 1.2 0 0 1-1.6-1.6l5.4-5.4" /></svg></button>
            <button id="modelPill" class="pill" title="Model"></button>
            <button id="thinkPill" class="pill" title="Thinking level"></button>
            <span id="ctxMeter" title="Context used"></span>
          </div>
          <div class="right">
            <span id="voiceState"></span>
            <button id="micBtn" class="icon-btn round" title="Voice typing (⌘⇧D)">
              <svg viewBox="0 0 20 20"><rect x="7.5" y="3" width="5" height="9" rx="2.5" /><path d="M5 9.5a5 5 0 0 0 10 0M10 14.5V17" /></svg>
            </button>
            <button id="sendBtn" class="send" title="Send (Enter)">
              <svg class="i-send" viewBox="0 0 20 20"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5" /></svg>
              <svg class="i-stop" viewBox="0 0 20 20"><rect x="6" y="6" width="8" height="8" rx="1.5" /></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="statusline"></div>
    </div>
  </main>

  <aside id="panel" hidden>
    <header class="panel-head drag">
      <div id="panelTabs"></div>
    </header>
    <div id="panelBody"></div>
  </aside>

  <div id="popover" class="menu" hidden></div>
  <div id="modal" hidden></div>
  <div id="toasts"></div>

  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../node_modules/dompurify/dist/purify.js"></script>
  <script src="../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
